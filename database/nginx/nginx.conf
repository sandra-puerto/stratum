# ============================================================================
# STRATUM-CORE — database
# Boundary client configuration.
# ============================================================================
#
# This configuration defines a Layer 4 (TCP) proxy for the persistence
# engines of the Stratum data layer. It is the only file mounted into the
# boundary client container.
#
# Design notes:
#   - No `user` directive: the process runs as UID 101 from the start.
#   - No allow/deny rules: segmentation is enforced by network topology,
#     not by access control lists.
#   - No static IPs: service names are resolved by the Docker embedded DNS,
#     re-resolved per connection via `resolver` + variable in `proxy_pass`
#     (a bare hostname in proxy_pass is resolved only once, at startup).
#   - proxy_timeout is set to 1h to accommodate long-lived database
#     sessions. Adjust per workload.
# ============================================================================

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# ----------------------------------------------------------------------------
# Layer 4 proxy for persistence engines
# ----------------------------------------------------------------------------
stream {

    # Docker's embedded DNS server. Short TTL so container recreation
    # (image updates, restarts with new IPs) is picked up without having
    # to reload nginx-database manually.
    resolver 127.0.0.11 valid=10s;

    # MariaDB / MySQL wire protocol
    server {
        listen 3306;
        set $upstream_mariadb mariadb:3306;
        proxy_pass $upstream_mariadb;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
    }

    # MongoDB wire protocol
    server {
        listen 27017;
        set $upstream_mongodb mongodb:27017;
        proxy_pass $upstream_mongodb;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
    }

    # Redis serialization protocol (RESP)
    server {
        listen 6379;
        set $upstream_redis redis:6379;
        proxy_pass $upstream_redis;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
    }
}

# ----------------------------------------------------------------------------
# Health endpoint
# ----------------------------------------------------------------------------
http {
    access_log off;

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 'ok\n';
        }

        location / {
            return 404;
        }
    }
}