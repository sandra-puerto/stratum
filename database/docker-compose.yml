services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb-core
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      database_internal:
        ipv4_address: 172.18.2.20

  mongodb:
    image: mongo:latest
    container_name: mongodb-core
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      database_internal:
        ipv4_address: 172.18.2.30

  redis:
    image: redis:alpine
    container_name: redis-core
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      database_internal:
        ipv4_address: 172.18.2.40

  nginx-database:
    image: nginx:alpine
    container_name: nginx-database
    restart: unless-stopped
    ports:
      - "3306:3306"
      - "27017:27017"
      - "6379:6379"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      database_internal:
        ipv4_address: 172.18.2.5
      global_network:
    depends_on:
      - mariadb
      - mongodb
      - redis

volumes:
  mariadb_data:
  mongo_data:
  redis_data:

networks:
  database_internal:
    name: database_internal_net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.18.2.0/24
          ip_range: 172.18.2.64/26
          gateway: 172.18.2.254

  global_network:
    name: ${GLOBAL_NETWORK_NAME}
    external: true